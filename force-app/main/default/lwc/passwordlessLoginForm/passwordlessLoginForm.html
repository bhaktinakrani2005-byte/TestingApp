<template>
    <lightning-card title="Login with Email OTP" icon-name="custom:custom63">
        <div class="slds-p-around_medium">
            <lightning-input label="Email" value={email} onchange={handleEmailChange} required></lightning-input>
            <lightning-button label="Send OTP" variant="brand" class="slds-m-top_small" onclick={sendOtp} disabled={isSending}></lightning-button>
        </div>
        <template if:true={showOtpSection}>
            <div class="slds-p-around_medium">
                <lightning-input label="OTP Code" value={code} onchange={handleCodeChange} required></lightning-input>
                <lightning-button label="Verify" variant="brand" class="slds-m-top_small" onclick={verifyOtp} disabled={isVerifying}></lightning-button>
            </div>
        </template>
        <template if:true={errorMessage}>
            <div class="slds-text-color_error slds-p-around_medium">{errorMessage}</div>
        </template>
    </lightning-card>
</template>
